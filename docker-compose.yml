services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - AUDIT_MAX_PAGES=${AUDIT_MAX_PAGES:-8}
      - AUDIT_TIMEOUT_MS=${AUDIT_TIMEOUT_MS:-15000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-elnerro2024@gmail.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - TOKEN_SECRET=${TOKEN_SECRET}
    volumes:
      - audit_data:/data
  worker:
    build: ./worker
    environment:
      - AUDIT_MAX_PAGES=${AUDIT_MAX_PAGES:-8}
      - AUDIT_TIMEOUT_MS=${AUDIT_TIMEOUT_MS:-15000}
    volumes:
      - audit_data:/data
  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
volumes:
  audit_data:
